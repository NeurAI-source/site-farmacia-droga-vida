name: Verificação de segurança
on:
  push:
  pull_request:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/security-check.mjs
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
