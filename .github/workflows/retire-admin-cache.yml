name: Remover cache do painel antigo
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  purge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Remover somente o cache dos endereços administrativos antigos
        run: node scripts/retire-admin-cache.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
